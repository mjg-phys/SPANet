# ---------------------------------------------------
# REQUIRED - INPUTS - List all inputs to SPANet here.
# ---------------------------------------------------
INPUTS:
  # -----------------------------------------------------------------------------
  # REQUIRED - SEQUENTIAL - inputs which can have an arbitrary number of vectors.
  # -----------------------------------------------------------------------------
  SEQUENTIAL:
    Jet:
      e: log_normalize
      pt: log_normalize
      eta: normalize
      phi: normalize
      btag: none
    Lepton:
      e: log_normalize
      pt: log_normalize
      eta: normalize
      phi: normalize
      mtag: none
      etag: none
      q: none

  # ---------------------------------------------------------------------
  # REQUIRED - GLOBAL - inputs which will have a single vector per event.
  # ---------------------------------------------------------------------
  GLOBAL:
    Met:
      met_met: log_normalize
      met_sin_phi: normalize
      met_cos_phi: normalize


# ----------------------------------------------------------------------
# REQUIRED - EVENT - Complete list of resonance particles and daughters.
# ----------------------------------------------------------------------
EVENT:
  t1:
    - q1: Jet
    - q2: Jet
    - b: Jet
  t2:
    - q1: Jet
    - q2: Jet
    - b: Jet
  t3:
    - l: Lepton
    - b: Jet
  t4:
    - l: Lepton
    - b: Jet

# ---------------------------------------------------------
# REQUIRED KEY - PERMUTATIONS - List of valid permutations.
# ---------------------------------------------------------
PERMUTATIONS:
    EVENT:
      - [ t1, t2 ]
      - [ t3, t4 ]
    t1:
      - [ q1, q2 ]
    t2:
      - [ q1, q2 ]


